name: Build and Release Plugin

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  # No paths-ignore: "Test" is a required check and must report on every PR
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (e.g., v1.0.0). Leave empty to just build."
        required: false
        type: string

env:
  DOTNET_VERSION: "10.0.x"
  PLUGIN_NAME: "Jellyfin.Plugin.Authentik"

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # Test: Build and run unit tests
  # ----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify targetAbi matches Jellyfin packages
        run: |
          # A targetAbi older than the compiled-against packages would let older servers load the plugin
          ABI=$(grep 'targetAbi:' build.yaml | sed 's/.*"\(.*\)"/\1/')
          FAIL=0
          for PKG in Jellyfin.Controller Jellyfin.Model; do
            VER=$(grep -oP "Include=\"${PKG}\" Version=\"\K[^\"]+" "${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.csproj")
            echo "${PKG}=${VER} targetAbi=${ABI}"
            if [[ "${VER}.0" != "${ABI}" ]]; then
              echo "::error file=build.yaml::targetAbi ${ABI} does not match ${PKG} ${VER}"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ----------------------------------------------------------
  # Build: Publish the plugin as a workflow artifact (also on PRs)
  # ----------------------------------------------------------
  build:
    name: Build Plugin
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build plugin
        run: |
          dotnet publish \
            "${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.csproj" \
            --configuration=Release \
            --output=artifacts \
            -p:Version=0.0.0.${{ github.run_number }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  # ----------------------------------------------------------
  # Release check: auto-release Renovate merges that change the shipped plugin
  # ----------------------------------------------------------
  release-check:
    name: Release check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Decide
        id: check
        run: |
          AUTHOR="$(git log -1 --format=%an)"
          CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          echo "Author: ${AUTHOR}"
          echo "Changed files:"; echo "${CHANGED}"
          # Only plugin sources and the plugin manifest affect the shipped zip
          if [[ "$AUTHOR" == "renovate[bot]" ]] && grep -qE '^(Jellyfin\.Plugin\.Authentik/|build\.yaml$|Directory\.Build\.props$)' <<< "$CHANGED"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------
  # Release: Create GitHub Release + update stable manifest on gh-pages
  # ----------------------------------------------------------
  release:
    name: Release
    if: >-
      !cancelled() && needs.test.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
        needs.release-check.outputs.release == 'true'
      )
    needs: [test, release-check]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Verify main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release can only be triggered from the main branch (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        id: version
        env:
          VERSION_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -z "$VERSION_TAG" ]]; then
            # Auto release: bump the patch part of the latest vA.B.C.D tag
            LATEST=$(git tag --list 'v*.*.*.*' --sort=-version:refname | head -1)
            IFS=. read -r MAJ MIN PAT _ <<< "${LATEST#v}"
            VERSION_TAG="v${MAJ}.${MIN}.$((PAT + 1)).0"
            echo "Auto release: ${LATEST} -> ${VERSION_TAG}"
          elif [[ ! "$VERSION_TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::release_tag must look like v1.2.3 or v1.2.3.4 (got ${VERSION_TAG})"
            exit 1
          fi
          VERSION="${VERSION_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          TARGET_ABI=$(grep 'targetAbi:' build.yaml | sed 's/.*"\(.*\)"/\1/')
          echo "target_abi=${TARGET_ABI}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          dotnet publish \
            "${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.csproj" \
            --configuration=Release \
            --output=artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Write meta.json
        run: |
          # Jellyfin refuses to load a plugin whose meta.json targetAbi is newer than the server, even for manual zip installs
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg targetAbi "${{ steps.version.outputs.target_abi }}" \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              category: "Authentication",
              changelog: ("Release " + $version),
              description: "Single sign-on authentication for Jellyfin using Authentik as the OpenID Connect provider. Supports automatic user provisioning and group-based permission sync.",
              guid: "f4c1d2a3-b5e6-4789-9abc-def012345678",
              name: "Authentik SSO",
              overview: "Authenticate with Authentik OIDC",
              owner: "scottfridwin",
              targetAbi: $targetAbi,
              timestamp: $timestamp,
              version: $version
            }' > artifacts/meta.json
          cat artifacts/meta.json

      - name: Create plugin zip
        run: |
          cd artifacts
          zip -r "../${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}.zip" .

      - name: Generate release notes
        run: |
          VERSION_TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | grep -v "^${VERSION_TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" | head -50)
          else
            NOTES="Initial release"
          fi
          {
            echo "$NOTES"
            echo ""
            echo "## Installation"
            echo ""
            echo "Download the zip file below and extract it into your Jellyfin plugins directory:"
            echo '```'
            echo "<jellyfin-data>/plugins/${{ env.PLUGIN_NAME }}/"
            echo '```'
            echo ""
            echo "Then restart Jellyfin."
          } > /tmp/release-notes.md

      - name: Create git tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: |
            ${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}.zip
          generate_release_notes: false

      - name: Update stable manifest on GitHub Pages
        run: |
          PLUGIN_NAME="${{ env.PLUGIN_NAME }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          TARGET_ABI="${{ steps.version.outputs.target_abi }}"
          ZIP_NAME="${PLUGIN_NAME}-${VERSION}.zip"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          CHECKSUM="$(md5sum "${ZIP_NAME}" | awk '{print $1}')"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          NEW_VERSION=$(jq -n \
            --arg version "$VERSION" \
            --arg targetAbi "$TARGET_ABI" \
            --arg sourceUrl "$SOURCE_URL" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TIMESTAMP" \
            '{
              version: $version,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp,
              changelog: ("Release " + $version)
            }')

          # Switch to gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git fetch origin gh-pages:gh-pages 2>/dev/null && git checkout gh-pages || { git checkout --orphan gh-pages; git rm -rf . 2>/dev/null || true; }

          # Merge new version into existing manifest (one entry per targetAbi)
          if [ -f manifest.json ]; then
            EXISTING=$(cat manifest.json)
          else
            EXISTING='[]'
          fi

          echo "$EXISTING" | jq \
            --argjson newVersion "$NEW_VERSION" \
            '
            if length == 0 then
              [{
                category: "Authentication",
                description: "Single sign-on authentication for Jellyfin using Authentik as the OpenID Connect provider. Supports automatic user provisioning and group-based permission sync.",
                guid: "f4c1d2a3-b5e6-4789-9abc-def012345678",
                name: "Authentik SSO",
                overview: "Authenticate with Authentik OIDC",
                owner: "scottfridwin",
                versions: [$newVersion]
              }]
            else
              .[0].versions = (
                [.[0].versions[] | select(.targetAbi != $newVersion.targetAbi)] + [$newVersion]
              ) | .
            end
            ' > manifest.json

          git add manifest.json
          git commit -m "Update stable manifest for ${TAG}" --allow-empty
          git push origin gh-pages

  # ----------------------------------------------------------
  # Notify: bot-triggered runs on main email nobody, so open an issue
  # ----------------------------------------------------------
  notify-failure:
    name: Notify failure
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build, release-check, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE="CI failed on main"
          BODY="Run: ${RUN_URL}
          Commit: ${GITHUB_SHA::7} $(head -1 <<< "$COMMIT_MSG")"
          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "${{ github.repository_owner }}"
          fi
